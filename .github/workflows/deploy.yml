name: Build and Deploy to GitHub Pages

# Run this workflow on every push to the main branch
on:
  push:
    branches: [ main ]

# Give the workflow permissions to write to the repository
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🟩
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a current LTS version of Node.js

      - name: Install dependencies 📦
        run: npm install

      - name: Build project 🏗️
        run: npm run build # This runs the "gulp build" command

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the action should deploy